[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["adaptive-study-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["adaptive-study-data"]

[tool.bandit]
exclude_dirs = ["adaptive-study-data", "tests"]
skips = ["B603"]
